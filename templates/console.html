{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-0">Live Attack Console</h2>
        <small class="text-muted">Real-time request &rarr; response stream from every honeypot service</small>
    </div>
    <div class="btn-group">
        <button id="console-pause" class="btn btn-outline-warning btn-sm">
            <i class="bi bi-pause-fill me-1"></i> Pause
        </button>
        <button id="console-clear" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-trash me-1"></i> Clear
        </button>
    </div>
</div>

<div class="card">
    <div class="card-header d-flex align-items-center">
        <div class="pulse-dot me-2"></div>
        CyberTrap :: live capture
        <span class="ms-auto text-muted small" id="console-count">0 events</span>
    </div>
    <div class="card-body p-0">
        <div id="console-output" class="console">
            <div class="console-idle text-muted">Waiting for traffic on SSH:2222, HTTP:8080, FTP:2121...</div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/console.js') }}"></script>
{% endblock %}
