<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTrap Honeypot</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h4><span class="fs-4">CyberTrap</span></h4>
        </div>
        <ul class="nav flex-column mb-auto">
            <li class="nav-item">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">
                    <i class="bi bi-speedometer2 me-2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a href="/logs" class="nav-link {% if request.path == '/logs' %}active{% endif %}">
                    <i class="bi bi-list-ul me-2"></i> Attack Logs
                </a>
            </li>
            <li class="nav-item">
                <a href="/console" class="nav-link {% if request.path == '/console' %}active{% endif %}">
                    <i class="bi bi-terminal me-2"></i> Live Console
                </a>
            </li>
            <li class="nav-item">
                <a href="/threats" class="nav-link {% if request.path == '/threats' %}active{% endif %}">
                    <i class="bi bi-crosshair me-2"></i> Threat Intel
                </a>
            </li>
            <li class="nav-item">
                <a href="/report" class="nav-link {% if request.path == '/report' %}active{% endif %}">
                    <i class="bi bi-file-earmark-text me-2"></i> Report
                </a>
            </li>
            <li class="nav-item">
                <a href="/settings" class="nav-link {% if request.path == '/settings' %}active{% endif %}">
                    <i class="bi bi-gear me-2"></i> Settings
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <hr>
            <div class="d-flex align-items-center justify-content-center">
                <div class="status-indicator"></div>
                <span class="ms-2">Honeypot Active</span>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid p-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
