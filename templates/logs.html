{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Attack Logs</h2>
    <a href="/api/export/csv" class="btn btn-outline-info">
        <i class="bi bi-download me-1"></i> Export CSV
    </a>
</div>

<div class="card mb-4">
    <div class="card-body">
        <form id="filter-form" class="row g-3">
            <div class="col-md-3">
                <label for="filter-service" class="form-label">Service</label>
                <select id="filter-service" class="form-select">
                    <option value="">All Services</option>
                    <option value="SSH">SSH</option>
                    <option value="HTTP">HTTP</option>
                    <option value="FTP">FTP</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filter-type" class="form-label">Attack Type</label>
                <select id="filter-type" class="form-select">
                    <option value="">All Types</option>
                    <option value="SQL Injection">SQL Injection</option>
                    <option value="XSS">XSS</option>
                    <option value="Path Traversal">Path Traversal</option>
                    <option value="Command Injection">Command Injection</option>
                    <option value="Credential Harvesting">Credential Harvesting</option>
                    <option value="Brute Force">Brute Force</option>
                    <option value="Probing">Probing</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="filter-severity" class="form-label">Severity</label>
                <select id="filter-severity" class="form-select">
                    <option value="">All</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <div class="col-md-3">
                <label for="filter-ip" class="form-label">Source IP</label>
                <input type="text" class="form-control" id="filter-ip" placeholder="Search IP...">
            </div>
            <div class="col-md-1 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Filter</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover table-dark table-striped mb-0" id="logs-table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Timestamp</th>
                        <th scope="col">Service</th>
                        <th scope="col">Source IP</th>
                        <th scope="col">Attack Type</th>
                        <th scope="col">Severity</th>
                        <th scope="col">Payload Extract</th>
                    </tr>
                </thead>
                <tbody id="logs-tbody">
                    <!-- Logs populated by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="d-flex justify-content-center mt-4">
    <nav aria-label="Page navigation">
        <ul class="pagination pagination-dark" id="logs-pagination">
            <li class="page-item disabled"><a class="page-link" href="#" id="prev-page">Previous</a></li>
            <li class="page-item"><span class="page-link" id="current-page">1</span></li>
            <li class="page-item"><a class="page-link" href="#" id="next-page">Next</a></li>
        </ul>
    </nav>
</div>

<!-- Attack Detail Modal -->
<div class="modal fade" id="detail-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content text-light bg-dark-card border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Attack Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modal-content">
                <!-- Content injected by JS -->
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="modal-view-ip">View All from this IP</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
